name: Metrics

on:
  # Schedule updates daily at midnight UTC
  schedule: [{cron: "0 0 * * *"}]
  # Allow manual trigger via GitHub Actions tab
  workflow_dispatch:
  # Run on push to main
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 3D Isometric Calendar
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          filename: metrics.plugin.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Kuala_Lumpur
          delay: 15

      - name: Languages & Coding Habits
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          filename: metrics.plugin.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          config_timezone: Asia/Kuala_Lumpur
          delay: 15

      - name: PiYak Spotlight
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          filename: metrics.repo.piyak.svg
          token: ${{ secrets.METRICS_TOKEN }}
          template: repository
          user: NurazimRoizan
          repo: PiYak
          delay: 15

      - name: Wallo Spotlight
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          filename: metrics.repo.wallo.svg
          token: ${{ secrets.METRICS_TOKEN }}
          template: repository
          user: NurazimRoizan
          repo: Nyekk
          delay: 15
